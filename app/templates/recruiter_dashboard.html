{% extends "base.html" %}
{% block title %}Recruiter Dashboard{% endblock %}

{% block content %}

<section class="py-5">

<div class="container">

<div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-5">

<div>
<h1>Recruiter Dashboard</h1>
<p class="text-secondary mb-0">
Manage jobs and track applicants.
</p>
</div>

<a href="/recruiter/create-job" class="btn btn-primary">
+ Create Job
</a>

</div>

<div class="row g-4 mb-5">

<div class="col-md-4">
<div class="stat-card">
<h2 id="totalJobs">0</h2>
<p>Total Jobs</p>
</div>
</div>

<div class="col-md-4">
<div class="stat-card">
<h2 id="totalApplicants">0</h2>
<p>Total Applicants</p>
</div>
</div>

<div class="col-md-4">
<div class="stat-card">
<h2 id="avgScore">0%</h2>
<p>Average ATS Score</p>
</div>
</div>

</div>

<div id="recruiterJobs"></div>

</div>

</section>

{% endblock %}
