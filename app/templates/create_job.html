{% extends "base.html" %}
{% block title %}Create Job{% endblock %}

{% block content %}

<section class="auth-section">

<div class="container">

<div class="auth-card" style="max-width:42rem;">

<h2>Create New Job</h2>
<p class="text-secondary">Publish a new opportunity for job seekers.</p>

<form id="createJobForm">

<div class="mb-3">
<label class="form-label">Job Title</label>
<input type="text" id="jobTitle" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Company</label>
<input type="text" id="company" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Location</label>
<input type="text" id="location" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Salary</label>
<input type="number" id="salary" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Employment Type</label>

<select id="employmentType" class="form-select">
<option value="Full-time">Full-time</option>
<option value="Part-time">Part-time</option>
<option value="Internship">Internship</option>
<option value="Remote">Remote</option>
</select>

</div>

<div class="mb-3">
<label class="form-label">Required Skills</label>

<input
type="text"
id="skillsRequired"
class="form-control"
placeholder="Python, Flask, SQL"
>

</div>

<div class="mb-4">
<label class="form-label">Description</label>

<textarea
id="description"
rows="5"
class="form-control"
required
></textarea>

</div>

<button class="btn btn-primary w-100 py-2" type="submit">
Publish Job
</button>

</form>

<div id="createJobMessage" class="mt-3 text-center"></div>

</div>

</div>

</section>

{% endblock %}
