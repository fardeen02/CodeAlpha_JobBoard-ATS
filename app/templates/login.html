{% extends "base.html" %}
{% block title %}Login - NovaHire ATS{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="container">

        <div class="auth-card">

            <h2>Welcome Back</h2>
            <p>Login to continue your hiring journey.</p>

            <form id="loginForm">

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">

                    <label class="form-label">Password</label>

                    <div class="input-group">

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="btn btn-outline-light"
                        >
                            👁
                        </button>

                    </div>

                </div>

                <button class="btn btn-primary w-100 py-2" type="submit">
                    Login
                </button>

            </form>

            <div id="loginMessage" class="mt-3 text-center"></div>

            <p class="mt-4 text-center text-secondary">
                Don't have an account?
                <a href="/register">Register</a>
            </p>

        </div>

    </div>

</section>

{% endblock %}
